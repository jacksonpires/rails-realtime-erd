name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rails 6.1 does not load on Ruby >= 3.4 (bigdecimal is no longer a default gem).
          - { rails: "6.1", ruby: "3.0", gemfile: gemfiles/rails_6_1.gemfile }
          - { rails: "6.1", ruby: "3.3", gemfile: gemfiles/rails_6_1.gemfile }
          - { rails: "7.2", ruby: "3.3", gemfile: gemfiles/rails_7_2.gemfile }
          - { rails: "7.2", ruby: "4.0", gemfile: gemfiles/rails_7_2.gemfile }
          - { rails: "8.1", ruby: "3.4", gemfile: Gemfile }
          - { rails: "8.1", ruby: "4.0", gemfile: Gemfile }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec standardrb
